server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: 20MB

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  application:
    name: cloud-storage

  session:
    store-type: redis
    timeout: 30m

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  storage:
    directory-splitter: /
    user-root-directory-pattern: "user-%d-files/"
    user-root-directory-regex: "^user-\\d+-files/"
    file-max-size: 100MB
    max-path-length: 100

  minio:
    url: ${MINIO_URL}
    accessKey: ${MINIO_ROOT_USER}
    secretKey: ${MINIO_ROOT_PASSWORD}
    bucket-name: user-files


  cors:
    allowedOrigin: http://localhost
